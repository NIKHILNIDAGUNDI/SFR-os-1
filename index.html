<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fleet OS - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Local Styles -->
    <link rel="stylesheet" href="src/css/main.css" />
    <style>
        :root {
            --bg-base: #F7F5F0;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #F8F6F2;
            --border-subtle: #0093A5;
            --border-card: rgba(30, 147, 165, 0.1);
            --text-bright: #34454C;
            --text-primary: #34454C;
            --text-secondary: #7B8688;
            --text-muted: #7B8688;
            --brand-primary: #D96629;
            --status-safe: #059669;
            --status-error: #DC2626;
            --font-sans: "Inter", sans-serif;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

            --tag-cat-a-bg: #E3F2FD;
            --tag-cat-a-fg: #1976D2;
            --tag-cat-b-bg: #E8F5E9;
            --tag-cat-b-fg: #388E3C;
            --tag-cat-c-bg: #FFFDE7;
            --tag-cat-c-fg: #F9A825;
        }

        body.dark-mode {
            --bg-base: #111314;
            --bg-surface: #1E272B;
            --bg-card: #1E272B;
            --bg-card-subtle: #263238;
            --border-subtle: #2DB7C9;
            --border-card: rgba(45, 183, 201, 0.2);
            --text-bright: #F0F2F2;
            --text-primary: #F0F2F2;
            --text-secondary: #A2B0AD;
            --text-muted: #A2B0AD;
            --brand-primary: #E57338;
            --status-safe: #81C784;
            --status-error: #E57373;

            --tag-cat-a-bg: rgba(25, 118, 210, 0.2);
            --tag-cat-a-fg: #90CAF9;
            --tag-cat-b-bg: rgba(56, 142, 60, 0.2);
            --tag-cat-b-fg: #A5D6A7;
            --tag-cat-c-bg: rgba(249, 168, 37, 0.2);
            --tag-cat-c-fg: #FFE082;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 2rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--tag-cat-a-bg);
            color: var(--tag-cat-a-fg);
        }

        body.dark-mode .badge {
            background: rgba(25, 118, 210, 0.2);
            color: #90CAF9;
        }

        .theme-toggle {
            background-color: var(--bg-card-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 500;
            width: auto;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
        }

        h1 {
            color: var(--text-bright);
            margin: 0 0 0.5rem 0;
            font-size: 2.25rem;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin: 0 0 1.5rem 0;
            font-size: 1.125rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-bright);
            font-size: 0.95rem;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
            color: var(--text-primary);
            border-radius: 6px;
            font-family: var(--font-sans);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.25rem;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .alert.success {
            background-color: rgba(5, 150, 105, 0.1);
            color: var(--status-safe);
            border: 1px solid var(--status-safe);
            display: block;
        }

        .alert.error {
            background-color: rgba(220, 38, 38, 0.1);
            color: var(--status-error);
            border: 1px solid var(--status-error);
            display: block;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: var(--bg-card-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-pill strong {
            color: var(--status-safe);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        button {
            background-color: var(--brand-primary);
            color: #FFFFFF;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
        }

        body.dark-mode button {
            color: #0F172A;
        }

        button:hover {
            opacity: 0.92;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-btn {
            background-color: #64748B;
            color: #FFFFFF !important;
        }

        body.dark-mode .login-btn {
            background-color: var(--bg-card-subtle);
            color: var(--text-primary) !important;
            border: 1px solid var(--border-subtle);
        }

        .info-card {
            background-color: var(--bg-card-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 0.85rem 1rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Smart Fleet OS Login</h2>
        <div id="loginAlert" class="alert alert-error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <script>
        // Predefined credentials for each page - UPDATED TO MATCH NEW FILES
        const pageCredentials = {
            cleaning: { username: 'cleaner', password: 'clean123', page: 'cleaner.html' },
            charging: { username: 'charger', password: 'charge123', page: 'charging.html' },
            scheduler: { username: 'scheduler', password: 'schedule123', page: 'scheduler.html' },
            entry_recorder: { username: 'entry', password: 'entry123', page: 'entry_recorder.html' }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Validate form
            if (!username || !password) {
                showAlert('Please fill in all fields');
                return;
            }

            // Check credentials against all predefined options
            let matchedPage = null;
            for (const key in pageCredentials) {
                const creds = pageCredentials[key];
                if (username === creds.username && password === creds.password) {
                    matchedPage = creds.page;
                    break;
                }
            }

            if (matchedPage) {
                // Set up session for scheduler if logging in as scheduler
                if (matchedPage === 'scheduler.html' && username === 'scheduler' && password === 'schedule123') {
                    // Generate mock token matching scheduler.html's generateMockToken function
                    const token = btoa('scheduler:' + Date.now() + ':secure_salt_mock');
                    sessionStorage.setItem('auth_token', token);
                    sessionStorage.setItem('auth_role', 'scheduler');
                }
                // Redirect to the matched page
                window.location.href = matchedPage;
            } else {
                showAlert('Invalid username or password');
            }
        });

        function showAlert(message) {
            const alertDiv = document.getElementById('loginAlert');
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
        }
    </script>
</body>
</html>
