<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fleet OS - Scheduler Console</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Local app data & database scripts -->
    <script src="src/data/app_data.js"></script>
    <script src="src/js/database.js"></script>
    <style>
        :root {
            --bg-base: #F7F5F0;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #F8F6F2;
            --border-subtle: #0093A5;
            --border-card: rgba(30, 147, 165, 0.1);
            --text-bright: #34454C;
            --text-primary: #34454C;
            --text-secondary: #7B8688;
            --text-muted: #7B8688;
            --brand-primary: #D96629;
            --status-safe: #059669;
            --status-error: #DC2626;
            --font-sans: "Inter", sans-serif;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

            --tag-cat-a-bg: #E3F2FD;
            --tag-cat-a-fg: #1976D2;
            --tag-cat-b-bg: #E8F5E9;
            --tag-cat-b-fg: #388E3C;
            --tag-cat-c-bg: #FFFDE7;
            --tag-cat-c-fg: #F9A825;
        }

        body.dark-mode {
            --bg-base: #111314;
            --bg-surface: #1E272B;
            --bg-card: #1E272B;
            --bg-card-subtle: #263238;
            --border-subtle: #2DB7C9;
            --border-card: rgba(45, 183, 201, 0.2);
            --text-bright: #F0F2F2;
            --text-primary: #F0F2F2;
            --text-secondary: #A2B0AD;
            --text-muted: #A2B0AD;
            --brand-primary: #E57338;
            --status-safe: #81C784;
            --status-error: #E57373;

            --tag-cat-a-bg: rgba(25, 118, 210, 0.2);
            --tag-cat-a-fg: #90CAF9;
            --tag-cat-b-bg: rgba(56, 142, 60, 0.2);
            --tag-cat-b-fg: #A5D6A7;
            --tag-cat-c-bg: rgba(249, 168, 37, 0.2);
            --tag-cat-c-fg: #FFE082;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--tag-cat-c-bg);
            color: var(--tag-cat-c-fg);
        }

        body.dark-mode .badge {
            background: rgba(245, 158, 11, 0.2);
            color: #FCD34D;
        }

        .theme-toggle {
            background-color: var(--bg-card-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 500;
            width: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--text-bright);
            margin: 0;
            margin-bottom: 0.5rem;
            font-size: 2.25rem;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 1.125rem;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-bright);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-bright);
        }

        input[type="text"],
        input[type="password"],
        select,
        input[type="time"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-subtle);
            background-color: var(--bg-base);
            color: var(--text-primary);
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--brand-primary);
            color: #FFFFFF;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        body.dark-mode button {
            color: #0F172A;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .logout-btn {
            background-color: #64748B;
            margin-top: 1rem;
            color: #FFFFFF;
        }

        body.dark-mode .logout-btn {
            background-color: var(--bg-card-subtle);
            color: var(--text-primary);
        }

        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.success {
            background-color: rgba(5, 150, 105, 0.1);
            color: var(--status-safe);
            border: 1px solid var(--status-safe);
            display: block;
        }

        .alert.error {
            background-color: rgba(220, 38, 38, 0.1);
            color: var(--status-error);
            border: 1px solid var(--status-error);
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        /* Stats tags */
        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--bg-card-subtle);
            color: var(--text-secondary);
        }

        .tag.cat-a {
            background: var(--tag-cat-a-bg);
            color: var(--tag-cat-a-fg);
        }

        .tag.cat-b {
            background: var(--tag-cat-b-bg);
            color: var(--tag-cat-b-fg);
        }

        .tag.cat-c {
            background: var(--tag-cat-c-bg);
            color: var(--tag-cat-c-fg);
        }

        /* Auto-assignment result box */
        #auto-assignment-result {
            margin-bottom: 1.25rem;
            padding: 1rem;
            background-color: var(--bg-card-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            display: none;
        }

        /* Disabled state styling */
        button[disabled]:hover {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-top">
            <span class="badge">Database 4: Scheduler</span>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">☀️ Light</button>
        </div>

        <div class="header">
            <h1>Smart Fleet OS</h1>
            <p id="scheduler-depot-label">Route & Driver Assignment</p>
        </div>



        <!-- Scheduler View -->
        <div id="scheduler-view" class="card view-section">
            <h2>Scheduler Console</h2>
            <p style="color:var(--text-secondary)">Route & Driver Assignment.</p>
            <div class="form-group"
                style="padding-bottom:1rem; border-bottom:1px solid var(--border-subtle); margin-bottom:1.5rem;">
                <p><strong>Available Buses in Ready Pool:</strong> <span id="pool-count" class="tag">0</span></p>
            </div>

            <div id="scheduler-alert" class="alert"></div>

            <div class="form-group">
                <label for="scheduler-route-select">Select Route / Schedule (Primary Input)</label>
                <select id="scheduler-route-select" onchange="onScheduleSelected()"></select>
            </div>

            <!-- Auto-Assignment Proposed Review Box -->
            <div id="auto-assignment-result"
                style="margin-bottom: 1.25rem; padding: 1.25rem; background-color: var(--bg-card-subtle); border: 1px solid var(--border-subtle); border-radius: 8px; display: none;">
                <!-- Proposed assignment & reasoning displayed here -->
            </div>

            <div class="form-group">
                <label for="scheduler-bus-select">Assigned Bus (Auto-Populated on Route Selection)</label>
                <select id="scheduler-bus-select" onchange="onManualResourceChanged()"></select>
            </div>

            <div class="form-group">
                <label for="scheduler-driver-select">Assigned Driver (Auto-Populated on Route Selection)</label>
                <select id="scheduler-driver-select" onchange="onManualResourceChanged()"></select>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
                <button id="final-assign-btn" onclick="finalizeAssignment()" style="flex:1;" disabled>Confirm & Save Assignment</button>
                <button class="logout-btn" onclick="schedulerLogout()" style="width: auto;">Logout</button>
            </div>

            <!-- Active Confirmed Assignments Section -->
            <div style="margin-top: 2.5rem; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem;">
                <h3 style="margin-top:0; color:var(--text-bright); font-size: 1.15rem;">Active Confirmed Assignments</h3>
                <div style="overflow-x:auto;">
                    <table id="confirmed-assignments-table" style="width:100%; border-collapse:collapse; margin-top:0.75rem; font-size: 0.9rem;">
                        <thead>
                            <tr style="text-align:left; border-bottom:1px solid var(--border-subtle);">
                                <th style="padding:0.5rem;">Schedule ID</th>
                                <th style="padding:0.5rem;">Route</th>
                                <th style="padding:0.5rem;">Assigned Bus</th>
                                <th style="padding:0.5rem;">Assigned Driver</th>
                                <th style="padding:0.5rem; text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="confirmed-assignments-body">
                            <!-- Filled dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
            const ACTIVE_DEPOT_ID=new URLSearchParams(location.search).get('depotId')||'chandapura';
        function activeDepotName(){try{const state=JSON.parse(localStorage.getItem('sfos_multi_v2')||'null'),depot=(state?.depots||[]).find(item=>item.id===ACTIVE_DEPOT_ID);if(depot?.name)return depot.name;}catch(e){}return ACTIVE_DEPOT_ID==='chandapura'?'Chandapura Depot 44':ACTIVE_DEPOT_ID.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+' Depot';}
        function showActiveDepotDescription(text){const subtitle=document.querySelector('.subtitle');if(subtitle)subtitle.textContent=text;}

        // --- THEME MANAGEMENT ---
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-btn');
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                btn.innerText = '☀️ Light';
                localStorage.setItem('fleet_theme', 'light');
            } else {
                body.classList.add('dark-mode');
                btn.innerText = '🌙 Dark';
                localStorage.setItem('fleet_theme', 'dark');
            }
        }

        if (localStorage.getItem('fleet_theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-btn').innerText = '🌙 Dark';
        }

        // --- SECURITY & UTILITIES ---
        // Security: Basic input sanitization to prevent XSS
        function sanitizeInput(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Security: Mocking session tokens (scheduler-specific)
        function generateMockToken(role) {
            return btoa(role + ':' + Date.now() + ':secure_salt_mock');
        }

        function verifySession() {
            const token = sessionStorage.getItem('auth_token');
            const role = sessionStorage.getItem('auth_role');
            if (!token || !role) return null;
            try {
                const decoded = atob(token);
                if (decoded.startsWith(role + ':')) {
                    return role;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // Authorization Guard - Scheduler only
        function requireSchedulerRole() {
            const role = verifySession();
            if (!role || role !== 'scheduler') {
                schedulerLogout();
                throw new Error("Unauthorized Access - Scheduler role required");
            }
            return role;
        }

        // --- STATE MANAGEMENT ---
        window.onload = function () {
            // Safe access to globals
            window.FLEET = typeof FLEET !== 'undefined' ? FLEET : [];
            window.SCHEDULES = typeof SCHEDULES !== 'undefined' ? SCHEDULES : [];
            window.ROUTES = typeof ROUTES !== 'undefined' ? ROUTES : [];

            let localWorkflowState = {};
            try {
                let item = localStorage.getItem('fleet_workflow_state');
                if (item) {
                    let parsed = JSON.parse(item);
                    if (typeof parsed === 'object' && parsed !== null) {
                        localWorkflowState = parsed;
                    }
                }
            } catch (e) {
                console.warn("Could not parse state from localStorage.");
            }

            function saveState() {
                localStorage.setItem('fleet_workflow_state', JSON.stringify(localWorkflowState));
            }

            // Initialize state for all buses
            window.FLEET.forEach(bus => {
                if (!localWorkflowState[bus.id]) {
                    localWorkflowState[bus.id] = {
                        chargeApproved: false,
                        cleanApproved: false,
                        scheduleAssigned: null,
                        assignedDriver: null
                    };
                }
            });
            saveState();

            window.getMergedFleet = function () {
                return window.FLEET.map(bus => {
                    return {
                        ...bus,                           // Base fleet data
                        ...localWorkflowState[bus.id]     // Workflow state overlay
                    };
                });
            };

            // --- NAVIGATION ---
            window.showView = function (viewId) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                clearAlerts();
            };

            function clearAlerts() {
                document.querySelectorAll('.alert').forEach(el => {
                    el.className = 'alert';
                    el.innerText = '';
                });
            }

            window.showAlert = function (viewPrefix, type, msg) {
                const el = document.getElementById(viewPrefix + '-alert');
                // Safe assignment using sanitize
                el.innerHTML = sanitizeInput(msg);
                el.className = 'alert ' + type;
            };

            // Check if there is an active session on load
            const activeRole = verifySession();
            if (activeRole === 'scheduler') {
                loadSchedulerView();
                showView('scheduler-view');
            } else {
                // Redirect to main login if not authenticated
                window.location.href = 'index.html';
            }

            // --- AUTHENTICATION ---
            window.schedulerLogout = function () {
                // Return all assigned buses to depot before logging out
                try {
                    const assignments = window.FleetDB.Scheduler.getAssignments();
                    assignments.forEach(bus => {
                        window.FleetDB.Scheduler.returnToDepot(bus.busId);
                    });
                } catch (e) {
                    console.warn("Error returning buses to depot during logout:", e);
                }
                sessionStorage.removeItem('auth_token');
                sessionStorage.removeItem('auth_role');
                window.location.href = 'index.html';
            };

            function goToMainLogin() {
                window.location.href = 'index.html';
            }

            function loadSchedulerView() {
                requireSchedulerRole();
                initSchedulerView();
            }

            // --- SCHEDULER LOGIC ---
            function initSchedulerView() {
                requireSchedulerRole();
                const depotLabel=document.getElementById('scheduler-depot-label');if(depotLabel)depotLabel.textContent=`${activeDepotName()} · Route & Driver Assignment`;
                const readyPool = window.FleetDB.Scheduler.getReadyPool(ACTIVE_DEPOT_ID);
                document.getElementById('pool-count').innerText = readyPool.length;

                const scheduleSelect = document.getElementById('scheduler-route-select');
                scheduleSelect.innerHTML = '<option value="">-- Choose Schedule (Route) --</option>';

                const assignments = window.FleetDB.Scheduler.getAssignments();
                const assignedScheduleIds = assignments.map(b => b.scheduleAssigned).filter(Boolean);

                // Compute allowed categories and time slots for schedules if needed
                window.SCHEDULES.forEach(sch => {
                    const routeInfo = window.ROUTES.find(r => r.id === sch.route);
                    const routeDiff = routeInfo ? routeInfo.category : 'Moderate';
                    const [h, m] = (sch.departure || "00:00").split(':').map(Number);
                    const mins = (h || 0) * 60 + (m || 0);

                    let ts = 'Peak';
                    if (mins < 420) ts = 'Normal';
                    else if (mins >= 420 && mins < 600) ts = 'Extreme Peak';
                    else if (mins >= 960 && mins < 1200) ts = 'Extreme Peak';

                    if (!sch.allowedCats || sch.allowedCats.length === 0) {
                        if (routeDiff === 'Complex') sch.allowedCats = ['A'];
                        else if (routeDiff === 'Simple' && ts === 'Normal') sch.allowedCats = ['A', 'B', 'C'];
                        else sch.allowedCats = ['A', 'B'];
                    }
                });

                // Populate route dropdown with unassigned schedules
                const availableSchedules = window.SCHEDULES.filter(s => !assignedScheduleIds.includes(s.id));
                availableSchedules.forEach(sch => {
                    const routeObj = window.ROUTES.find(r => r.id === sch.route);
                    const routeName = routeObj ? routeObj.name : sch.route;
                    const opt = document.createElement('option');
                    opt.value = sanitizeInput(sch.id);
                    opt.text = `${sch.id} | Route ${sch.route} (${routeName}) | Req: ${sch.singleChargeReq}km | Cat: ${sch.allowedCats.join(', ')} | Driver: ${sch.driverReq || 'Standard'}`;
                    scheduleSelect.appendChild(opt);
                });

                // Reset bus and driver select boxes
                const busSelect = document.getElementById('scheduler-bus-select');
                busSelect.innerHTML = '<option value="">-- Auto-Populated on Route Selection --</option>';

                const driverSelect = document.getElementById('scheduler-driver-select');
                driverSelect.innerHTML = '<option value="">-- Auto-Populated on Route Selection --</option>';

                // Render Active Confirmed Assignments Table
                renderConfirmedAssignmentsTable(assignments);
            }

            function renderConfirmedAssignmentsTable(assignments) {
                const tbody = document.getElementById('confirmed-assignments-body');
                if (!tbody) return;
                tbody.innerHTML = '';

                if (!assignments || assignments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="padding:1rem; text-align:center; color:var(--text-secondary);">No active assignments confirmed yet.</td></tr>';
                    return;
                }

                assignments.forEach(asgn => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid var(--border-card)';

                    const schedule = window.SCHEDULES.find(s => s.id === asgn.scheduleAssigned) || {};
                    const routeId = schedule.route || 'N/A';

                    tr.innerHTML = `
                        <td style="padding:0.6rem 0.5rem; font-weight:600;">${sanitizeInput(asgn.scheduleAssigned || 'N/A')}</td>
                        <td style="padding:0.6rem 0.5rem;">${sanitizeInput(routeId)}</td>
                        <td style="padding:0.6rem 0.5rem;"><span class="tag cat-${(asgn.cat || 'B').toLowerCase()}">${sanitizeInput(asgn.busId)} (${sanitizeInput(asgn.regNo || 'N/A')})</span></td>
                        <td style="padding:0.6rem 0.5rem;">${sanitizeInput(asgn.assignedDriver || 'N/A')}</td>
                        <td style="padding:0.6rem 0.5rem; text-align:right;">
                            <button onclick="unassignAssignment('${sanitizeInput(asgn.busId)}')" style="padding:0.35rem 0.65rem; font-size:0.8rem; background:transparent; color:var(--status-error); border:1px solid var(--status-error); width:auto; border-radius:4px; cursor:pointer;">
                                Unassign
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            window.onScheduleSelected = function () {
                requireSchedulerRole();
                clearAlerts();
                evaluateBestBus();
            };

            window.evaluateBestBus = function () {
                requireSchedulerRole();
                const scheduleSelect = document.getElementById('scheduler-route-select');
                const scheduleId = sanitizeInput(scheduleSelect.value);
                const resultBox = document.getElementById('auto-assignment-result');
                const assignBtn = document.getElementById('final-assign-btn');
                const busSelect = document.getElementById('scheduler-bus-select');
                const driverSelect = document.getElementById('scheduler-driver-select');

                if (!scheduleId) {
                    resultBox.style.display = 'none';
                    assignBtn.disabled = true;
                    busSelect.innerHTML = '<option value="">-- Auto-Populated on Route Selection --</option>';
                    driverSelect.innerHTML = '<option value="">-- Auto-Populated on Route Selection --</option>';
                    window.currentBestBusId = null;
                    return;
                }

                // Call automatic assignment engine in FleetDB
                const rec = window.FleetDB.Scheduler.recommendAssignment(scheduleId, {
                    schedules: window.SCHEDULES,
                    fleet: window.FLEET,
                    routes: window.ROUTES,
                    depotId: ACTIVE_DEPOT_ID
                });

                if (!rec.success) {
                    resultBox.style.display = 'block';
                    assignBtn.disabled = true;
                    window.currentBestBusId = null;

                    let errorIcon = '&#9888;';
                    let errorTitle = 'Assignment Cannot Be Completed';
                    if (rec.errorType === 'NO_BUS') {
                        errorTitle = 'No Suitable Bus Available';
                        busSelect.innerHTML = '<option value="">-- No Eligible Bus Available --</option>';
                    } else if (rec.errorType === 'NO_DRIVER') {
                        errorTitle = 'No Eligible Driver Available';
                        if (rec.bus) {
                            busSelect.innerHTML = `<option value="${sanitizeInput(rec.bus.busId)}" selected>Bus ${sanitizeInput(rec.bus.busId)} (${sanitizeInput(rec.bus.regNo)})</option>`;
                        }
                        driverSelect.innerHTML = '<option value="">-- No Eligible Driver Available --</option>';
                    }

                    resultBox.innerHTML = `
                        <div style="color:var(--status-error); font-weight:700; font-size:1.05rem; margin-bottom:0.35rem;">
                            ${errorIcon} ${errorTitle}
                        </div>
                        <div style="font-size:0.9rem; color:var(--text-secondary); line-height:1.4;">
                            ${sanitizeInput(rec.reason)}
                        </div>
                    `;
                    return;
                }

                // Recommendation succeeded!
                const bestBus = rec.bus;
                const bestDriver = rec.driver;
                const schedule = rec.schedule;
                window.currentBestBusId = bestBus.busId;

                // 1. Auto-populate Bus select dropdown
                busSelect.innerHTML = '';
                const busOpt = document.createElement('option');
                busOpt.value = sanitizeInput(bestBus.busId);
                busOpt.text = `Bus ${bestBus.busId} (${bestBus.regNo}) - Cat ${bestBus.cat} | ${bestBus.actualRange} km (Recommended)`;
                busOpt.selected = true;
                busSelect.appendChild(busOpt);

                // Add other ready pool buses as alternate choices for review
                const readyPool = window.FleetDB.Scheduler.getReadyPool(ACTIVE_DEPOT_ID);
                readyPool.forEach(b => {
                    if (b.busId !== bestBus.busId && schedule.allowedCats.includes(b.cat) && b.actualRange >= schedule.singleChargeReq) {
                        const opt = document.createElement('option');
                        opt.value = sanitizeInput(b.busId);
                        opt.text = `Bus ${b.busId} (${b.regNo}) - Cat ${b.cat} | ${b.actualRange} km`;
                        busSelect.appendChild(opt);
                    }
                });

                // 2. Auto-populate Driver select dropdown
                driverSelect.innerHTML = '';
                const driverOpt = document.createElement('option');
                driverOpt.value = sanitizeInput(bestDriver);
                driverOpt.text = `${bestDriver} (Recommended)`;
                driverOpt.selected = true;
                driverSelect.appendChild(driverOpt);

                // Add other available drivers
                const allDrivers = Array.from(new Set(window.FLEET.map(b => b.driver).filter(Boolean))).sort();
                const assignedDrivers = window.FleetDB.Scheduler.getAssignments().map(b => b.assignedDriver).filter(Boolean);
                allDrivers.forEach(d => {
                    if (d !== bestDriver && !assignedDrivers.includes(d) && window.FleetDB.isDriverEligible(d, schedule)) {
                        const opt = document.createElement('option');
                        opt.value = sanitizeInput(d);
                        opt.text = d;
                        driverSelect.appendChild(opt);
                    }
                });

                // 3. Display Proposed Assignment Review Box
                resultBox.style.display = 'block';
                const safeBusId = sanitizeInput(bestBus.busId);
                const safeBusReg = sanitizeInput(bestBus.regNo);
                const safeCat = sanitizeInput(bestBus.cat);
                const safeCats = sanitizeInput(schedule.allowedCats.join(', '));
                const safeDriver = sanitizeInput(bestDriver);

                resultBox.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                        <span class="badge" style="background:var(--tag-cat-b-bg); color:var(--tag-cat-b-fg); font-weight:700;">
                            &#10003; PROPOSED ASSIGNMENT (Ready to Confirm)
                        </span>
                        <span style="font-size:0.85rem; color:var(--text-secondary);">Optimal Priority Match</span>
                    </div>
                    <div style="font-weight:600; font-size:1.1rem; margin-bottom:0.35rem; color:var(--text-bright);">
                        Route ${sanitizeInput(schedule.route)} &larr; Bus ${safeBusId} (${safeBusReg}) & Driver ${safeDriver}
                    </div>
                    <div style="font-size:0.9rem; color:var(--text-secondary); line-height:1.5;">
                        <strong>Bus Compatibility:</strong> Matches Category <strong>${safeCat}</strong> (Allowed: ${safeCats}).<br>
                        <strong>Battery Range:</strong> Actual range of <strong>${bestBus.actualRange} km</strong> satisfies route requirement of <strong>${schedule.singleChargeReq} km</strong> with safety buffer of <strong>+${rec.bufferKm} km</strong>.<br>
                        <strong>Driver Eligibility:</strong> <strong>${safeDriver}</strong> verified for <strong>${schedule.driverReq || 'Standard'}</strong> route requirements without schedule overlap.
                    </div>
                `;

                assignBtn.disabled = false;

                // Allocate the validated recommendation immediately after schedule selection.
                window.finalizeAssignment();
            };

            window.onManualResourceChanged = function () {
                requireSchedulerRole();
                const busSelect = document.getElementById('scheduler-bus-select');
                if (busSelect.value) {
                    window.currentBestBusId = sanitizeInput(busSelect.value);
                }
            };

            window.finalizeAssignment = function () {
                requireSchedulerRole();
                const scheduleId = sanitizeInput(document.getElementById('scheduler-route-select').value);
                const busId = sanitizeInput(document.getElementById('scheduler-bus-select').value) || window.currentBestBusId;
                const driverName = sanitizeInput(document.getElementById('scheduler-driver-select').value);

                if (!scheduleId || !driverName || !busId) {
                    showAlert('scheduler', 'error', 'Please ensure a route, bus, and driver are selected before confirming.');
                    return;
                }

                try {
                    // Assign bus using atomic pre-commit validation in SchedulerDB
                    window.FleetDB.Scheduler.assignBus(busId, scheduleId, driverName, {
                        schedules: window.SCHEDULES,
                        fleet: window.FLEET,
                        depotId: ACTIVE_DEPOT_ID
                    });

                    // Update local workflow state
                    if (localWorkflowState[busId]) {
                        localWorkflowState[busId].scheduleAssigned = scheduleId;
                        localWorkflowState[busId].assignedDriver = driverName;
                        saveState();
                    }

                    // Update memory schedule state
                    const sch = window.SCHEDULES.find(s => s.id === scheduleId);
                    if (sch) {
                        sch.assignedBus = busId;
                        sch.assignedDriver = driverName;
                        sch.status = 'Assigned';
                    }

                    showAlert('scheduler', 'success', `Confirmed! Bus ${busId} and Driver ${driverName} successfully assigned to Schedule ${scheduleId}.`);

                    document.getElementById('auto-assignment-result').style.display = 'none';
                    document.getElementById('final-assign-btn').disabled = true;
                    window.currentBestBusId = null;

                    initSchedulerView(); // Refresh route dropdown, ready pool count, and confirmed assignments table
                } catch (e) {
                    showAlert('scheduler', 'error', 'Assignment failed: ' + e.message);
                }
            };

            window.unassignAssignment = function (busId) {
                requireSchedulerRole();
                if (!busId) return;

                try {
                    window.FleetDB.Scheduler.unassignBus(busId);

                    if (localWorkflowState[busId]) {
                        localWorkflowState[busId].scheduleAssigned = null;
                        localWorkflowState[busId].assignedDriver = null;
                        saveState();
                    }

                    showAlert('scheduler', 'success', `Bus ${busId} has been unassigned and returned to the ready pool.`);
                    initSchedulerView();
                } catch (e) {
                    showAlert('scheduler', 'error', 'Error unassigning bus: ' + e.message);
                }
            };
        };
    </script>

</body>

</html>
