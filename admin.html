<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Fleet OS – Multi-Depot Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#37474f;--mut:#78909c;--line:#3b8ea5;--btn:#e5b59c;--btnh:#d9976f;--slate:#687489;--ok:#3a9068;--warn:#d99a1e;--blue:#2f6fd0;--p1:#e6f0fb;--p2:#e8f5e9;--p4:#fff8dc;--bad:#c0583a;--land:#e9efe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2127;--card:#252d35;--ink:#e3e9ee;--mut:#9aa7b2;--line:#4aa3ba;--btn:#b9795a;--btnh:#cf8c6a;--slate:#56637a;--ok:#5cc596;--warn:#f0b84a;--blue:#6ea3f2;--p1:#1f3248;--p2:#1f3a2a;--p4:#3d3418;--bad:#e5896c;--land:#2c363e}}
:root[data-theme="dark"]{--bg:#1b2127;--card:#252d35;--ink:#e3e9ee;--mut:#9aa7b2;--line:#4aa3ba;--btn:#b9795a;--btnh:#cf8c6a;--slate:#56637a;--ok:#5cc596;--warn:#f0b84a;--blue:#6ea3f2;--p1:#1f3248;--p2:#1f3a2a;--p4:#3d3418;--bad:#e5896c;--land:#2c363e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1150px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.layout{display:flex;align-items:flex-start;gap:20px}
.sidebar{width:220px;flex:0 0 220px;display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.sidebar .pill{display:block;text-align:center}
.side-nav{display:grid;gap:6px}
.nav-item{width:100%;text-align:left;border:0;border-radius:8px;background:transparent;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--mut)}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:var(--line);color:#fff}
.scanned-bus td{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.scanned-bus td:first-child{box-shadow:inset 4px 0 var(--ok)}
.sidebar-actions{display:grid;gap:8px;margin-top:8px}
.sidebar-actions button{width:100%}
.main-content{flex:1;min-width:0}
.pill{padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px;background:var(--p1);color:var(--blue)}
button,select,input,textarea{font:inherit;color:var(--ink)}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--mut)}
.card{background:var(--card);border-radius:14px;padding:22px;margin-top:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h1{margin:16px 0 2px;font-size:28px;text-align:center}h2{margin:0 0 6px;font-size:21px}h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--mut);margin:0 0 12px;text-align:center}.sub.l{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}.kpi b{display:block;font-size:28px}.kpi span{color:var(--mut);font-size:13px}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--bg);margin:10px 0 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.tools input,.tools select,.inl,.f input,.f select,.f textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.tools input{flex:1;min-width:180px;width:auto}.tools select{width:auto}.inl{width:auto;min-width:130px}
.btn{background:var(--btn);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}.btn:hover{background:var(--btnh)}
.btn.s{background:var(--slate)}.btn.sm{padding:6px 10px;font-size:13px}.btn.out{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.tw{overflow-x:auto;border:1px solid color-mix(in srgb,var(--line) 40%,transparent);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 25%,transparent);font-size:14px}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;display:inline-block}
.t-ok{background:var(--p2);color:var(--ok)}.t-w{background:var(--p4);color:var(--warn)}.t-b{background:var(--p1);color:var(--blue)}
.log{font-size:13px;color:var(--mut);margin:0;padding:0;list-style:none}.log li{padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.login{max-width:400px;margin:10vh auto 0}.login label,.f label{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}
.login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.login-submit{transition:background .2s,box-shadow .2s}
.login-submit.ready{background:var(--line);box-shadow:0 0 0 3px color-mix(in srgb,var(--line) 25%,transparent)}
.login-submit.ready:hover{background:var(--blue)}
.scan-overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.68)}
.scan-dialog{width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:14px;background:var(--card);box-shadow:0 12px 48px rgba(0,0,0,.3)}
.scan-dialog video{display:block;width:100%;max-height:52vh;aspect-ratio:4/3;object-fit:cover;background:#111;border-radius:10px}
.scan-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.scan-status{min-height:24px;color:var(--mut);font-size:14px}
.scan-result{width:100%;min-height:78px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.scan-candidates{display:grid;gap:8px;margin-top:10px}
.scan-candidates button{text-align:left}
.err{color:var(--bad);min-height:20px;font-size:13px;margin-top:10px}.empty{padding:26px;text-align:center;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.f textarea{min-height:110px;resize:vertical}.hint{font-size:12px;color:var(--mut);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px}.chip a{cursor:pointer;color:var(--bad);margin-left:6px}
.map{width:100%;max-width:460px;margin:0 auto;display:block}.mapbox{display:grid;grid-template-columns:minmax(260px,460px) 1fr;gap:18px;align-items:center}
@media(max-width:760px){.mapbox{grid-template-columns:1fr}.layout{display:block}.sidebar{width:auto;margin-bottom:16px}.side-nav{display:flex;overflow-x:auto}.nav-item{width:auto;flex:0 0 auto;white-space:nowrap}.sidebar-actions{display:flex}.sidebar-actions button{width:auto;flex:1}}
code{background:var(--bg);padding:2px 6px;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style></head>
<body><div class="wrap" id="app"></div><div id="scannerLayer"></div><div id="toast"></div>
<script>
const CITIES=[["Bengaluru",12.97,77.59,"KA"],["Chennai",13.08,80.27,"TN"],["Hyderabad",17.38,78.48,"TS"],["Mumbai",19.08,72.88,"MH"],["Pune",18.52,73.86,"MH"],["Delhi",28.61,77.21,"DL"],["Kolkata",22.57,88.36,"WB"],["Kochi",9.93,76.27,"KL"],["Ahmedabad",23.02,72.57,"GJ"],["Jaipur",26.91,75.79,"RJ"],["Other (enter lat / lon)",0,0,"XX"]];
const ROLES=[["entry","Entry Recorder"],["clean","Cleaner"],["charge","Charging Incharge"],["sched","Scheduler"],["mgr","Depot Manager"]];
const OUTLINE=[[74.5,37],[77,35.5],[79,34],[78.5,31],[81,30],[80,28.5],[84,27.5],[88,27],[88.5,26.5],[92,27],[95,28.5],[97,28],[96,26],[94,24],[93,22],[92.5,23],[91.5,24],[89,22],[87,21],[85,19.5],[82.5,17],[80.2,15.5],[80.3,13],[79.8,10.5],[78,8.5],[77.5,8],[76.5,9],[75,12],[74,15],[73,17.5],[72.8,20],[72.5,21.5],[70,21],[69,22.5],[70.5,23],[68.2,23.7],[70,25],[71,27],[74,31],[74.5,34]];
const KEY="sfos_multi_v2";
let S,auth=null,scanStream=null,scanWorker=null,ocrPromise=null,ui={tab:"net",depot:"",q:"",f:"pending",xf:"",selectedBus:""};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cid=s=>String(s).replace(/[^A-Za-z0-9_-]/g,"");
const rpw=()=>{const c="abcdefghjkmnpqrstuvwxyz23456789";let o="";for(let i=0;i<8;i++)o+=c[Math.floor(Math.random()*c.length)];return o};
const lines=t=>[...new Set(String(t).split(/\n/).map(x=>x.trim()).filter(Boolean))];
const busLines=t=>String(t).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const dep=id=>S.depots.find(d=>d.id===id);
const dn=id=>dep(id)?dep(id).name:"(removed)";
const bd=id=>S.buses.filter(b=>b.loc===id);
const stage=b=>!b.entry?"entry":(b.clean&&b.charge)?(b.route?"assigned":"ready"):"processing";
const tag=(t,c)=>`<span class="tag t-${c}">${t}</span>`;
const SN={entry:["At entry","w"],processing:["In clean / charge","w"],ready:["Ready pool","ok"],assigned:["Assigned","b"]};

function isAvailableForEntry(b, depotId){
  if(!b||!depotId)return false;
  const linked=b.linkedDepots&&b.linkedDepots.length?b.linkedDepots:[b.home||b.loc].filter(Boolean);
  if(!linked.includes(depotId))return false;
  if(b.entry)return false;
  if(b.maintenance)return false;
  if(b.transferTo){
    return b.transferTo===depotId;
  }
  return true;
}

function mkDepot(o,pf){
  let base=(o.name.trim().split(/\s+/)[0]||"depot").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,10)||"depot",id=base,n=2;
  while(S&&S.depots.some(d=>d.id===id))id=base+n++;
  const users={};ROLES.forEach(r=>users[r[0]]={u:id+"-"+r[0],p:pf()});
  return {id,name:o.name.trim(),city:o.city,lat:+o.lat,lon:+o.lon,routes:o.routes,drivers:o.drivers,users};
}
function mkBuses(d,pre,start,st,n){
  const a=[];
  for(let i=0;i<n;i++)a.push({
    id:pre+(start+i),
    reg:st+"51AH"+String((8184+i*37)%10000).padStart(4,"0"),
    entry:false,clean:false,charge:false,route:"",driver:"",
    home:d.id,loc:d.id,linkedDepots:[d.id],
    transferTo:null,transferFrom:null,transferStatus:null,
    maintenance:false,entryDepot:null,entryAt:null
  });
  return a;
}
function flow(d,bs,e,c,ch,a){bs.forEach((b,i)=>{if(i<e){b.entry=true;b.entryDepot=d.id;b.entryAt=new Date().toISOString()}if(i<c)b.clean=true;if(i<ch)b.charge=true;if(i<a){b.route=d.routes[i];b.driver=d.drivers[i]}})}
function seed(){
  S={depots:[],buses:[],log:[]};
  const r=(p,n)=>Array.from({length:n},(_,i)=>p+(101+i)),dr=["Ramesh K","Manjunath S","Imran Pasha","Lokesh B","Venkatesh R","Syed Arif","Prakash N","Gopal M","Naveen Kumar","Basavaraj H"];
  [["Chandapura Depot 44","Bengaluru",12.8,77.7,"BM",221,"KA",122,[34,14,9,3],"SCH-"],["Tondiarpet Depot","Chennai",13.12,80.29,"TN",100,"TN",40,[15,8,6,2],"CHN-"],["Miyapur Depot","Hyderabad",17.5,78.36,"TS",300,"TS",50,[20,10,8,2],"HYD-"]].forEach(x=>{
    const d=mkDepot({name:x[0],city:x[1],lat:x[2],lon:x[3],routes:r(x[9],10),drivers:dr.slice()},()=>"demo1234");
    S.depots.push(d);const bs=mkBuses(d,x[4],x[5],x[6],x[7]);flow(d,bs,...x[8]);S.buses.push(...bs)});
  
  const allDepotIds=S.depots.map(d=>d.id);
  // Shared Bus Example 1: KA-25-1234 shared across Chandapura, Tondiarpet, and Miyapur (awaiting entry)
  S.buses.unshift({
    id:"KA-25-1234",reg:"KA-25-1234",entry:false,clean:false,charge:false,route:"",driver:"",
    home:allDepotIds[0],loc:null,linkedDepots:[...allDepotIds],transferTo:null,transferFrom:null,transferStatus:null,
    maintenance:false,entryDepot:null,entryAt:null
  });
  // Shared Bus Example 2: BM221 shared across Chandapura, Tondiarpet, and Miyapur
  const bm221=S.buses.find(b=>b.id==="BM221");
  if(bm221){
    bm221.linkedDepots=["chandapura","tondiarpet","miyapur"];
    bm221.entry=false;bm221.loc=null;bm221.clean=false;bm221.charge=false;
  }
  // Shared Bus Example 3: BM222 shared across Chandapura and Tondiarpet
  const bm222=S.buses.find(b=>b.id==="BM222");
  if(bm222)bm222.linkedDepots=["chandapura","tondiarpet"];

  logm("Demo network loaded: 3 depots, "+S.buses.length+" physical buses (including cross-depot shared fleet)");
}
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      S=JSON.parse(r);
      const allDepotIds=S.depots.map(d=>d.id);
      S.buses.forEach(b=>{
        if(!b.linkedDepots||!b.linkedDepots.length)b.linkedDepots=[b.home||b.loc].filter(Boolean);
        if(b.transferTo===undefined)b.transferTo=null;
        if(b.transferFrom===undefined)b.transferFrom=null;
        if(b.transferStatus===undefined)b.transferStatus=null;
        if(b.maintenance===undefined)b.maintenance=false;
      });
      if(!S.buses.some(b=>b.id==="KA-25-1234")){
        S.buses.unshift({
          id:"KA-25-1234",reg:"KA-25-1234",entry:false,clean:false,charge:false,route:"",driver:"",
          home:allDepotIds[0]||"chandapura",loc:null,linkedDepots:[...allDepotIds],transferTo:null,transferFrom:null,transferStatus:null,
          maintenance:false,entryDepot:null,entryAt:null
        });
      }
      const bm221=S.buses.find(b=>b.id==="BM221");
      if(bm221&&(!bm221.linkedDepots||bm221.linkedDepots.length<=1)){
        bm221.linkedDepots=["chandapura","tondiarpet","miyapur"];
        bm221.entry=false;bm221.loc=null;bm221.clean=false;bm221.charge=false;
      }
      S.depots.forEach(d=>{d.users=d.users||{};ROLES.forEach(x=>{if(!d.users[x[0]])d.users[x[0]]={u:d.id+"-"+x[0],p:rpw()}})});
      save();return;
    }
  }catch(e){}
  seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function logm(m,...ds){S.log.unshift({t:new Date().toLocaleString(),m,d:ds});S.log=S.log.slice(0,300)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2800)}
function stats(d){
  const c={n:0,entry:0,processing:0,ready:0,assigned:0,clean:0,charge:0};
  const present=S.buses.filter(b=>b.loc===d&&b.entry);
  const awaiting=S.buses.filter(b=>isAvailableForEntry(b,d));
  c.entry=awaiting.length;
  c.n=present.length+awaiting.length;
  present.forEach(b=>{
    c[stage(b)]++;
    if(!b.clean)c.clean++;
    if(!b.charge)c.charge++;
  });
  return c;
}
const curD=()=>auth.role==="admin"?(dep(ui.depot)?ui.depot:(S.depots[0]||{}).id):auth.depot;
const can=t=>auth.role==="admin"||auth.role==="mgr"||auth.role===t;

/* ---------- actions ---------- */
function act(id,type){
  load();
  const b=S.buses.find(x=>x.id===id);if(!b)return toast("Bus "+id+" not found");
  const d=curD();
  
  if(auth.role!=="admin"){
    if(type==="entry"){
      const linked=b.linkedDepots&&b.linkedDepots.length?b.linkedDepots:[b.home||b.loc].filter(Boolean);
      if(!linked.includes(d))return toast("Bus "+b.id+" is not authorized for entry at "+dn(d));
    }else{
      if(b.loc!==d)return toast("You can only manage buses physically located at your depot");
    }
  }

  if(type==="entry"){
    if(b.entry){
      if(b.loc===d) return toast("Bus "+id+" is already marked as entered at this depot.");
      return toast("Concurrent Entry Blocked: Bus "+b.id+" ("+b.reg+") is ALREADY entered at "+dn(b.loc)+"!");
    }
    if(b.transferTo&&b.transferTo!==d){
      return toast("Entry Blocked: Bus "+b.id+" is currently in transit to "+dn(b.transferTo)+"!");
    }
    if(b.maintenance){
      return toast("Entry Blocked: Bus "+b.id+" is currently under maintenance!");
    }
    b.entry=true;
    b.loc=d;
    b.entryDepot=d;
    b.entryAt=new Date().toISOString();
    b.transferTo=null;
    b.transferFrom=null;
    b.transferStatus=null;
    const msg=id+" ("+b.reg+") recorded & entered at "+dn(d)+", forwarded to Cleaner + Charging";
    logm(msg,d);save();render();toast(msg);return;
  }

  if(type==="unentry"){
    b.entry=b.clean=b.charge=false;
    b.route=b.driver="";
    const linked=b.linkedDepots||[b.home||b.loc].filter(Boolean);
    if(linked.length>1)b.loc=null;
    b.entryDepot=null;b.entryAt=null;
    const msg=id+" entry reverted at "+dn(d);
    logm(msg,d);save();render();toast(msg);return;
  }

  const M={
    clean:()=>{b.clean=true;return id+" cleaning approved"},
    unclean:()=>{b.clean=false;b.route=b.driver="";return id+" cleaning reverted"},
    charge:()=>{b.charge=true;return id+" charging approved"},
    uncharge:()=>{b.charge=false;b.route=b.driver="";return id+" charging reverted"},
    assign:()=>{const r=$("r_"+id).value,dv=$("d_"+id).value;if(!r||!dv){toast("Choose route and driver");return null}b.route=r;b.driver=dv;return id+" assigned to "+r+" with "+dv},
    unassign:()=>{const m=id+" unassigned from "+b.route;b.route=b.driver="";return m}
  };
  const m=M[type]();if(!m)return;logm(m,d);
  if((type==="clean"||type==="charge")&&stage(b)==="ready")logm(id+" moved to Scheduler ready pool",d);
  save();render();
}
function bulk(kind){
  load();
  const d=curD();
  const rows=rowsFor(kind).filter(b=>kind==="entry"?!b.entry:!b[kind]);
  if(!rows.length)return toast("Nothing pending");
  if(kind==="entry"){
    let count=0;
    rows.forEach(b=>{
      if(!b.entry&&(!b.transferTo||b.transferTo===d)&&!b.maintenance){
        b.entry=true;b.loc=d;b.entryDepot=d;b.entryAt=new Date().toISOString();
        b.transferTo=null;b.transferFrom=null;b.transferStatus=null;
        count++;
      }
    });
    logm("Bulk approved "+count+" buses at Entry Recorder ("+dn(d)+")",d);
    save();render();toast(count+" buses approved for entry");return;
  }
  rows.forEach(b=>b[kind]=true);
  logm("Bulk approved "+rows.length+" buses at "+ROLES.find(r=>r[0]===kind)[1],d);
  save();render();toast(rows.length+" approved");
}
function tx(id,to){
  load();
  const b=S.buses.find(x=>x.id===id);if(!b||!to||!dep(to))return toast("Choose a destination depot");
  if(auth.role!=="admin"&&b.loc!==auth.depot)return toast("You can only transfer buses from your depot");
  const from=b.loc;if(from===to)return toast("Bus is already at that depot");
  
  b.loc=null; // Departs current depot
  b.entry=b.clean=b.charge=false;
  b.route=b.driver="";
  b.transferFrom=from;
  b.transferTo=to;
  b.transferStatus="in_transit";
  if(!b.linkedDepots)b.linkedDepots=[from];
  if(!b.linkedDepots.includes(to))b.linkedDepots.push(to);

  logm(id+" departed "+dn(from)+" in transit → "+dn(to)+" (awaits confirmed Entry at "+dn(to)+")",from,to);
  save();render();toast(id+" dispatched in transit to "+dn(to));
}
function txRow(id){tx(id,$("x_"+id).value)}
function txForm(){const id=cid($("t_id").value),b=S.buses.find(x=>x.id.toLowerCase()===id.toLowerCase());if(!b)return toast("Bus code not found");tx(b.id,$("t_to").value)}
function addDepot(){
  if(auth.role!=="admin")return toast("Only the admin can create depots");
  const name=$("f_name").value.trim();if(!name)return toast("Enter a depot name");

function parseBusRows(text,expected,targetDepotId){
  const rows=busLines(text);
  if(rows.length!==expected)return {error:"Enter exactly "+expected+" bus lines; "+rows.length+" pasted."};
  const targetId=targetDepotId||curD();
  const busesToAdd=[],busesToLink=[],seenInBatch=new Set();
  for(let i=0;i<rows.length;i++){
    const parts=rows[i].split(",");
    if(parts.length!==2)return {error:"Bus line "+(i+1)+" must be BUS CODE, REGISTRATION."};
    const code=parts[0].trim(),reg=parts[1].trim(),safeCode=cid(code),safeReg=esc(reg);
    if(!code||safeCode!==code||!reg)return {error:"Bus line "+(i+1)+" needs a valid bus code and registration."};
    const codeLower=code.toLowerCase(),regLower=reg.toLowerCase();
    
    if(seenInBatch.has(codeLower)||seenInBatch.has(regLower)){
      return {error:"Duplicate vehicle entry in current batch: "+code+" ("+reg+")"};
    }
    seenInBatch.add(codeLower);seenInBatch.add(regLower);
    
    const existingByCode=S.buses.find(b=>b.id.toLowerCase()===codeLower);
    const existingByReg=S.buses.find(b=>b.reg.toLowerCase()===regLower);
    
    // Exact match: reuse existing physical vehicle identity across depots!
    if(existingByCode&&existingByReg&&existingByCode.id===existingByReg.id){
      const linked=existingByCode.linkedDepots||[existingByCode.home||existingByCode.loc].filter(Boolean);
      if(linked.includes(targetId)){
        return {error:"Duplicate Registration Prevented: Bus "+code+" ("+reg+") is already registered and linked to "+dn(targetId)+"."};
      }
      busesToLink.push({bus:existingByCode,depotId:targetId});
      continue;
    }
    
    // Conflict detection:
    if(existingByCode&&(!existingByReg||existingByCode.id!==existingByReg.id)){
      return {error:"Identity Conflict: Bus code "+code+" is already registered with registration "+existingByCode.reg+". Cannot assign to "+reg+"."};
    }
    if(existingByReg&&(!existingByCode||existingByCode.id!==existingByReg.id)){
      return {error:"Duplicate Registration Prevented: Registration "+reg+" is already registered under bus code "+existingByReg.id+"."};
    }
    
    // New physical bus
    busesToAdd.push({
      id:code,reg:safeReg,entry:false,clean:false,charge:false,route:"",driver:"",
      home:targetId,loc:targetId,linkedDepots:[targetId],transferTo:null,transferFrom:null,transferStatus:null,
      maintenance:false,entryDepot:null,entryAt:null
    });
  }
  return {busesToAdd,busesToLink};
}

function requestScannerCamera(){
  const retryButton=$("retryCameraBtn");
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){
    scannerStatus("Live camera access requires HTTPS or localhost. Use your phone camera/photo above instead.");
    return;
  }
  if(retryButton)retryButton.disabled=true;
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})
    .then(stream=>{
      if(!$("scanVideo")){stream.getTracks().forEach(track=>track.stop());return}
      scanStream=stream;
      const video=$("scanVideo");video.srcObject=stream;
      return video.play().then(()=>{
        if($("capturePlateBtn"))$("capturePlateBtn").disabled=false;
        if(retryButton)retryButton.hidden=true;
        scannerStatus("Camera ready. Center the plate and capture it.");
      });
    })
    .catch(error=>{
      if(retryButton){retryButton.hidden=false;retryButton.disabled=false}
      const reason=error.name==="NotAllowedError"?"Camera permission was blocked. Close any floating bubbles or overlays and try again, or use your phone camera/photo above.":error.name==="NotFoundError"?"No camera was found on this device. Use your phone camera/photo above instead.":error.name==="NotReadableError"?"The camera is busy in another app. Close it and try again, or use your phone camera/photo above.":"Could not start the camera: "+error.message+" You can use your phone camera/photo above.";
      scannerStatus(reason);
    });
}

function loadOcr(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(ocrPromise)return ocrPromise;
  ocrPromise=new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    script.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error("OCR library loaded without its API."));
    script.onerror=()=>reject(new Error("Could not download the OCR library. Check your internet connection and try again."));
    document.head.appendChild(script);
  }).catch(error=>{ocrPromise=null;throw error});
  return ocrPromise;
}
async function getScanWorker(){
  if(scanWorker)return scanWorker;
  const Tesseract=await loadOcr();
  scanWorker=await Tesseract.createWorker("eng",1,{logger:message=>{
    if(message.status==="recognizing text")scannerStatus("Reading plate… "+Math.round((message.progress||0)*100)+"%");
    else if(message.status==="loading language model")scannerStatus("Loading English OCR model…");
  }});
  return scanWorker;
}
async function recognizePlate(image,button){
  if(button)button.disabled=true;
  try{
    scannerStatus("Preparing OCR…");
    const worker=await getScanWorker(),result=await worker.recognize(image);
    const text=$("scanText");
    if(text){text.value=result.data.text.trim();matchScannedText()}
  }catch(error){
    scannerStatus("Plate scan failed: "+error.message);
  }finally{
    if(button&&button.isConnected)button.disabled=false;
  }
}
async function scanPlate(){
  const video=$("scanVideo");
  if(!video||!video.videoWidth)return scannerStatus("Camera is not ready yet.");
  const canvas=document.createElement("canvas");canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
  await recognizePlate(canvas,$("capturePlateBtn"));
}

  const mk=S.depots.map(d=>{const [x,y]=P(d.lon,d.lat),c=stats(d.id),r=6+Math.sqrt(c.n)/1.5,left=d.lon<=79.5;
    return `<g style="cursor:pointer" onclick="openDepot('${d.id}')"><circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="var(--blue)" fill-opacity=".8" stroke="var(--card)" stroke-width="2"/><text x="${+x+(left?-r-4:r+4)}" y="${+y+4}" text-anchor="${left?"end":"start"}" font-size="11" font-weight="700" fill="var(--ink)">${esc(d.name.split(" ")[0])} · ${c.n}</text></g>`}).join("");
  return `<svg class="map" viewBox="0 0 400 410" role="img" aria-label="Depot map"><path d="${path}" fill="var(--land)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/>${mk}</svg>`;
}
function openDepot(id){ui.depot=id;go(auth.role==="admin"?"ov":"ov")}
function net(){
  const T=S.depots.reduce((a,d)=>{const c=stats(d.id);a.n+=c.n;a.r+=c.ready;a.a+=c.assigned;return a},{n:0,r:0,a:0});
  const totalFleet=S.buses.length;
  const presentBuses=S.buses.filter(b=>b.entry).length;
  const inTransitBuses=S.buses.filter(b=>b.transferStatus==="in_transit").length;
  const rows=S.depots.map(d=>{const c=stats(d.id);return `<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.city)}</td><td>${c.n}</td><td>${c.entry}</td><td>${c.processing}</td><td>${c.ready}</td><td>${c.assigned}</td><td><button class="btn sm" onclick="openDepot('${d.id}')">Open</button></td></tr>`}).join("");
  return `<div class="card"><h2>Network Overview</h2><p class="sub l">All depots and centralized fleet tracking. Click Open to inspect a depot.</p>
  <div class="kpis"><div class="kpi"><b>${S.depots.length}</b><span>Depots</span></div><div class="kpi"><b>${totalFleet}</b><span>Unique Fleet Buses</span></div><div class="kpi"><b>${presentBuses}</b><span>Buses Present in Depots</span></div><div class="kpi"><b>${inTransitBuses}</b><span>In Transit</span></div></div></div>
  <div class="card"><div class="tw"><table style="min-width:520px"><thead><tr><th>Depot</th><th>City</th><th>Present</th><th>Entry Pending</th><th>Clean/Chg</th><th>Ready</th><th>Assigned</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
  ${locator()}`;
}
function locator(){return `<div class="card"><h3>Bus Locator</h3><p class="sub l">${auth.role==="admin"?"Search buses across all depots.":"Search buses assigned or authorized for your depot."}</p><div class="tools"><input id="lq" placeholder="e.g., BM221, KA51AH8184, KA-25-1234…" value="${esc(ui.xf)}" oninput="ui.xf=this.value;locRes()"></div><div id="locres">${locHtml()}</div></div>`}
function locHtml(){
  const q=ui.xf.trim().toLowerCase();if(!q)return '<div class="empty">Start typing to search every depot.</div>';
  const r=S.buses.filter(b=>(auth.role==="admin"||(b.linkedDepots||[]).includes(auth.depot)||b.loc===auth.depot)&&(b.id.toLowerCase().includes(q)||b.reg.toLowerCase().includes(q))).slice(0,30);if(!r.length)return '<div class="empty">No bus found.</div>';
  return `<div class="tw"><table><thead><tr><th>Bus code</th><th>Registration</th><th>Authorized Depots</th><th>Current Status / Location</th><th>Stage</th><th>Route / driver</th></tr></thead><tbody>${r.map(b=>{
    const s=SN[stage(b)];
    const linked=(b.linkedDepots||[b.home||b.loc].filter(Boolean)).map(x=>dn(x)).join(", ");
    let locInfo=b.entry?`Present at ${esc(dn(b.loc))}`:(b.transferTo?`In Transit (${esc(dn(b.transferFrom))} → ${esc(dn(b.transferTo))})`:`Available for Entry across (${linked})`);
    return `<tr><td><b>${b.id}</b>${homeTag(b)}</td><td>${b.reg}</td><td>${esc(linked)}</td><td>${esc(locInfo)}</td><td>${tag(s[0],s[1])}</td><td>${b.route?esc(b.route)+" / "+esc(b.driver):"—"}</td></tr>`
  }).join("")}</tbody></table></div>`;
}
function locRes(){$("locres").innerHTML=locHtml()}
function addView(){
  return `<div class="card f"><h2>Add a New Depot</h2><p class="sub l">Enter the depot details by hand. Buses, schedule codes and drivers entered here show up immediately, and logins for the depot are generated automatically.</p>
  <div class="g2"><div><label>Depot name</label><input id="f_name" placeholder="e.g., Yeshwanthpur Depot"></div>
  <div><label>City / location</label><input id="f_city" placeholder="e.g., Bengaluru"></div></div>
  <div class="g2"><div><label>Number of buses <span class="hint">(required)</span></label><input id="f_count" type="number" min="1" max="500" step="1" placeholder="e.g., 40" oninput="cnt()"></div></div>
  <label>Paste exact buses <span class="hint">(required) – one per line: BUS CODE, REGISTRATION. Existing physical buses with matching code &amp; registration will be safely linked to this depot without creating duplicates.</span></label><textarea id="f_buses" oninput="cnt()" placeholder="BM221, KA51AH8184&#10;BM222, KA51AH8221"></textarea><p class="hint" id="f_cnt">0 of 0 buses entered</p>
  <div class="g2"><div><label>Schedule codes <span class="hint">– one per line</span></label><textarea id="f_sched" placeholder="SCH-101 Majestic&#10;SCH-102 Silk Board"></textarea></div><div><label>Driver names <span class="hint">– one per line</span></label><textarea id="f_drv" placeholder="Ramesh K&#10;Imran Pasha"></textarea></div></div>
  <div class="tools"><button class="btn" onclick="addDepot()">Add depot &amp; generate logins</button></div></div>`;
}
function loginsView(){
  const d=dep(curD());
  return `<div class="card"><h2>Logins · ${esc(d.name)}</h2><p class="sub l">Each depot gets five separate logins: Entry Recorder, Cleaner, Charging Incharge, Scheduler and Depot Manager. The Depot Manager can manage this depot only.</p>
  <div class="tw"><table><thead><tr><th>Role</th><th>User ID</th><th>Password</th><th></th></tr></thead><tbody>${ROLES.map(r=>`<tr><td>${r[1]}</td><td><code>${d.users[r[0]].u}</code></td><td><code>${d.users[r[0]].p}</code></td><td><button class="btn sm s" onclick="regen('${r[0]}')">Regenerate</button></td></tr>`).join("")}</tbody></table></div>
  </div>`;
}
function linkBusAction(){
  load();
  const d=dep(curD());
  const busId=$("link_bus_select")?.value;
  if(!busId)return toast("Select a bus to link");
  const b=S.buses.find(x=>x.id===busId);
  if(!b)return toast("Bus not found");
  if(!b.linkedDepots)b.linkedDepots=[b.home||b.loc].filter(Boolean);
  if(b.linkedDepots.includes(d.id))return toast("Bus is already linked to "+d.name);
  b.linkedDepots.push(d.id);
  logm("Bus "+b.id+" ("+b.reg+") linked as shared bus to "+d.name,d.id);
  save();render();toast("Bus "+b.id+" linked to "+d.name);
}
function unlinkBus(id,depotId){
  load();
  const b=S.buses.find(x=>x.id===id);
  if(!b)return toast("Bus not found");
  if(b.entry&&b.loc===depotId)return toast("Cannot unlink bus while it is physically present at this depot. Revert entry or transfer first.");
  if(!b.linkedDepots)b.linkedDepots=[b.home||b.loc].filter(Boolean);
  if(b.linkedDepots.length<=1)return toast("Cannot unlink the only authorized depot for this bus.");
  b.linkedDepots=b.linkedDepots.filter(x=>x!==depotId);
  if(b.home===depotId)b.home=b.linkedDepots[0];
  logm("Bus "+b.id+" ("+b.reg+") unlinked from "+dn(depotId),depotId);
  save();render();toast("Bus unlinked from "+dn(depotId));
}
function manage(){
  const d=dep(curD()),others=S.depots.filter(x=>x.id!==d.id);
  const chips=(l,k)=>`<div class="chips">${l.map((x,i)=>`<span class="chip">${esc(x)}<a onclick="remRes('${k}',${i})" title="Remove">×</a></span>`).join("")||'<span class="hint">None yet</span>'}</div>`;
  
  // Shared fleet options
  const unlinkedFleet=S.buses.filter(b=>!(b.linkedDepots||[b.home||b.loc]).includes(d.id));
  const linkedShared=S.buses.filter(b=>(b.linkedDepots||[b.home||b.loc]).includes(d.id)&&(b.linkedDepots||[]).length>1);

  return `<div class="card f"><h2>Manage · ${esc(d.name)}</h2><p class="sub l">Add buses, schedule codes and drivers at any time. Changes appear in every view straight away.</p>
  <div class="g2"><div><label>Number of buses</label><input id="m_count" type="number" min="1" max="500" step="1" oninput="cnt('m')" placeholder="e.g., 5"><label>Paste exact buses <span class="hint">BUS CODE, REGISTRATION per line</span></label><textarea id="m_b" oninput="cnt('m')"></textarea><p class="hint" id="m_cnt">0 of 0 buses entered</p><button class="btn sm" onclick="addRes('b')">Add buses</button></div>
  <div><label>Add schedule codes</label><textarea id="m_s"></textarea><button class="btn sm" onclick="addRes('s')">Add schedules</button>${chips(d.routes,"s")}</div>
  <div><label>Add drivers</label><textarea id="m_d"></textarea><button class="btn sm" onclick="addRes('d')">Add drivers</button>${chips(d.drivers,"d")}</div></div></div>
  
  <div class="card f"><h3>Cross-Depot Bus Sharing &amp; Authorization</h3>
  <p class="sub l">Authorize an existing physical bus from the central fleet to operate into <b>${esc(d.name)}</b>. The central bus identity is preserved across all depots without duplicating records.</p>
  <div class="g2">
    <div>
      <label>Link existing network bus to this depot</label>
      <select id="link_bus_select">
        <option value="">-- Choose bus to link --</option>
        ${unlinkedFleet.map(b=>`<option value="${b.id}">${b.id} (${b.reg}) · Current home: ${dn(b.home||b.loc)}</option>`).join("")}
      </select>
      <button class="btn sm" style="margin-top:8px" onclick="linkBusAction()">Link bus to ${esc(d.name)}</button>
    </div>
    <div>
      <label>Currently shared buses linked to ${esc(d.name)} (${linkedShared.length})</label>
      <div class="tw" style="max-height:220px;overflow-y:auto">
        <table><thead><tr><th>Bus</th><th>Registration</th><th>Linked Depots</th><th>Present</th><th></th></tr></thead>
        <tbody>
          ${linkedShared.map(b=>`<tr>
            <td><b>${b.id}</b></td><td>${b.reg}</td>
            <td><small>${(b.linkedDepots||[]).map(x=>dn(x)).join(", ")}</small></td>
            <td>${b.entry?tag(dn(b.loc),"ok"):tag("Available for entry","b")}</td>
            <td>${b.entry&&b.loc===d.id?`<small class="hint">Present</small>`:`<button class="btn sm out" onclick="unlinkBus('${b.id}','${d.id}')">Unlink</button>`}</td>
          </tr>`).join("")}
        </tbody></table>
        ${linkedShared.length?"":'<div class="empty">No shared buses currently linked.</div>'}
      </div>
    </div>
  </div>
  </div>

  <div class="card f"><h3>Transfer a bus to another depot</h3><div class="g2"><div><label>Bus code (currently at ${esc(d.name)})</label><input id="t_id" placeholder="e.g., BM221"></div><div><label>Destination depot</label><select id="t_to">${others.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></div></div>
  <p class="hint">The bus departs and moves into In-Transit state. It becomes available for entry ONLY at the destination depot upon arrival.</p><button class="btn" onclick="txForm()">Transfer bus</button></div>
  ${auth.role==="admin"?'<div class="card"><h3>Danger zone</h3><button class="btn out" onclick="delDepot()">Delete this depot</button></div>':""}`;
}
function logView(){return `<div class="card"><h2>Activity Log</h2><p class="sub l">${auth.role==="admin"?"All depots":esc(dn(auth.depot))}</p>${logList(auth.role==="admin"?"":auth.depot,300)}</div>`}

/* ---------- shell ---------- */
function tabsFor(){
  if(auth.role==="admin")return [["net","Network"],["add","Add Depot"],["ov","Depot Overview"],["manage","Manage"],["logins","Logins"],["log","Activity"]];
  if(auth.role==="mgr")return [["ov","Depot Overview"],["entry","Entry Recorder"],["clean","Cleaner"],["charge","Charging"],["sched","Scheduler"],["loc","Bus Locator"],["manage","Manage"],["logins","Logins"],["log","Activity"]];
  return [[auth.role,({entry:"Entry Recorder",clean:"Cleaner",charge:"Charging Incharge",sched:"Scheduler"})[auth.role]]];
}
function go(t){ui.tab=t;ui.q="";ui.f=t==="log"?"all":"pending";ui.selectedBus="";render()}
function partial(){const q=$("q"),pos=q.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(pos,pos)}
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
function theme(){document.documentElement.dataset.theme=isDark()?"light":"dark";render()}
const thBtn=()=>`<button class="ghost" onclick="theme()">${isDark()?"☀️ Light mode":"🌙 Dark mode"}</button>`;
function updateLoginButton(){
  const ready=$("u").value.trim()&&$("p").value;
  $("loginBtn").classList.toggle("ready",Boolean(ready));
}
function login(){
  $("app").innerHTML=`<div class="top"><span></span>${thBtn()}</div><div class="card login"><h2 style="text-align:center">Smart Fleet OS Login</h2><p class="sub">Multi-depot console</p>
  <label for="u">User ID</label><input id="u" autocomplete="username" autocapitalize="off" oninput="updateLoginButton()"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" oninput="updateLoginButton()" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="err" id="err"></div><button id="loginBtn" class="btn login-submit" style="width:100%;padding:13px" onclick="doLogin()">Login</button>
  <p class="sub" style="margin-top:14px;font-size:12px">Admin demo: admin / admin123 · Demo depot logins use password demo1234, e.g. chandapura-entry, chandapura-clean, chandapura-charge, chandapura-sched and chandapura-mgr.</p></div>`;
  updateLoginButton();
}
function doLogin(){
  const u=$("u").value.trim().toLowerCase(),p=$("p").value;
  if(u==="admin"&&p==="admin123"){auth={role:"admin"};ui={tab:"net",depot:"",q:"",f:"pending",xf:""};return render()}
  for(const d of S.depots)for(const r of ROLES)if(d.users[r[0]].u===u&&d.users[r[0]].p===p){auth={role:r[0],depot:d.id};ui={tab:r[0]==="mgr"?"ov":r[0],depot:d.id,q:"",f:"pending",xf:""};return render()}
  $("err").textContent="Invalid user ID or password.";
}
function logout(){auth=null;render()}
function cnt(prefix="f"){const n=Number($(prefix+"_count").value)||0,k=busLines($(prefix==="f"?"f_buses":"m_b").value).length;$(prefix+"_cnt").textContent=k+" of "+n+" buses entered"+(n&&k===n?" ✓":"")}
function render(){
  if(!auth)return login();
  if(auth.role!=="admin"&&!dep(auth.depot))return logout();
  const t=ui.tab,depTab=["ov","manage","logins"].includes(t),admin=auth.role==="admin";
  const noD=admin&&!S.depots.length&&depTab;
  const v=noD?'<div class="card empty">No depots yet. Use Add Depot.</div>':t==="net"?net():t==="add"?addView():t==="ov"?depOv():t==="manage"?manage():t==="logins"?loginsView():t==="log"?logView():t==="loc"?locator():t==="sched"?sched():["entry","clean","charge"].includes(t)?dbView(t):net();
  const who=admin?"Admin":(ROLES.find(r=>r[0]===auth.role)[1]+" · "+dn(auth.depot));
  const sel=admin&&depTab&&S.depots.length?`<select class="inl" onchange="ui.depot=this.value;render()" aria-label="Depot">${S.depots.map(d=>`<option value="${d.id}"${d.id===curD()?" selected":""}>${esc(d.name)}</option>`).join("")}</select>`:"";
  $("app").innerHTML=`<div class="layout"><aside class="sidebar"><span class="pill">${esc(who)}</span>${sel}
  <nav class="side-nav" aria-label="Main navigation">${tabsFor().map(x=>`<button class="nav-item${t===x[0]?" on":""}"${t===x[0]?' aria-current="page"':""} onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav>
  <div class="sidebar-actions">${thBtn()}<button class="ghost" onclick="logout()">Logout</button></div></aside>
  <main class="main-content"><h1>Smart Fleet OS</h1><p class="sub">${admin?"Multi-depot admin console":auth.role==="mgr"?"Depot manager console · limited to this depot":esc(dn(auth.depot))}</p>${v}</main></div>`;
}
window.addEventListener("storage", e => {
  if(e.key === KEY){
    load();
    render();
  }
});
load();render();
</script></body></html>
